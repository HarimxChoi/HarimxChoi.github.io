<text class="small muted" x="1140" y="476" text-anchor="end">WeCLIP+ 51.9</text>
<polyline points="112.0,449.6 454.7,328.4 797.3,311.6 1140.0,152" fill="none" class="accent" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
