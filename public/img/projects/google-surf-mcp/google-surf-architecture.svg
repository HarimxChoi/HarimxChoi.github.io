<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">Google Surf MCP architecture</title>
<desc id="desc">Seven MCP tools connect web, paper and code search to automatic local storage, ontology, lineage, and hybrid graph retrieval.</desc>
<style>
.bg{fill:#f7f6f2}.surface{fill:#ffffff}.soft{fill:#dfe9e6}.soft2{fill:#eef2ef}.ink{fill:#202827}.muted{fill:#566361}.faint{fill:#75817f}.line{stroke:#c7ceca}.accent{fill:#587776}.accent-line{stroke:#587776}.risk{fill:#c25a35}.risk-soft{fill:#f5e4dc}.title{font:650 36px ui-sans-serif,system-ui,sans-serif}.subtitle{font:20px ui-sans-serif,system-ui,sans-serif}.head{font:650 24px ui-sans-serif,system-ui,sans-serif}.body{font:19px ui-sans-serif,system-ui,sans-serif}.small{font:17px ui-sans-serif,system-ui,sans-serif}.mono{font:600 17px ui-monospace,SFMono-Regular,monospace}.stat{font:700 42px ui-monospace,SFMono-Regular,monospace}.arrow{fill:none;stroke:#587776;stroke-width:3}.dash{fill:none;stroke:#75817f;stroke-width:2;stroke-dasharray:7 7}
@media (prefers-color-scheme:dark){.bg{fill:#1b2423}.surface{fill:#222e2d}.soft{fill:#29423f}.soft2{fill:#293735}.ink{fill:#eef2ef}.muted{fill:#b7c3c0}.faint{fill:#93a29f}.line{stroke:#465754}.accent{fill:#8db0ab}.accent-line{stroke:#8db0ab}.risk{fill:#e07a56}.risk-soft{fill:#4a332c}.arrow{stroke:#8db0ab}.dash{stroke:#93a29f}}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" class="accent"/></marker></defs>
<rect class="bg" width="1440" height="1120" rx="18"/>
<text class="title ink" x="60" y="62" text-anchor="start">Search results become reusable knowledge</text>
<text class="subtitle muted" x="60" y="94" text-anchor="start">google-surf-mcp v1.0.9 · automatic knowledge graph + hybrid retrieval</text>
<rect class="surface line" x="60" y="125" width="1320" height="190" rx="18" stroke-width="1.5"/>
<text class="head ink" x="88" y="161" text-anchor="start">Seven MCP tools · research memory enabled by default</text>
<rect class="soft" x="88" y="184" width="132" height="42" rx="21"/>
<text class="mono ink" x="154" y="211" text-anchor="middle">search</text>
<rect class="soft" x="238" y="184" width="200" height="42" rx="21"/>
<text class="mono ink" x="338" y="211" text-anchor="middle">scholar_search</text>
<rect class="soft" x="456" y="184" width="220" height="42" rx="21"/>
<text class="mono ink" x="566" y="211" text-anchor="middle">search_parallel</text>
<rect class="soft" x="694" y="184" width="132" height="42" rx="21"/>
<text class="mono ink" x="760" y="211" text-anchor="middle">extract</text>
<rect class="soft" x="88" y="245" width="270" height="42" rx="21"/>
<text class="mono ink" x="223" y="272" text-anchor="middle">project_memory_search</text>
<rect class="soft" x="376" y="245" width="220" height="42" rx="21"/>
<text class="mono ink" x="486" y="272" text-anchor="middle">project_memory</text>
<rect class="soft" x="614" y="245" width="132" height="42" rx="21"/>
<text class="mono ink" x="680" y="272" text-anchor="middle">health</text>
<rect class="surface line" x="60" y="370" width="400" height="255" rx="18" stroke-width="1.5"/>
<text class="head ink" x="88" y="413" text-anchor="start">SEARCH + EXTRACT</text>
<circle class="accent" cx="88" cy="451" r="4"/>
<text class="body ink" x="104" y="457" text-anchor="start">Web + papers + codebases</text>
<circle class="accent" cx="88" cy="485" r="4"/>
<text class="body ink" x="104" y="491" text-anchor="start">HTML and PDF body extraction</text>
<circle class="accent" cx="88" cy="519" r="4"/>
<text class="body ink" x="104" y="525" text-anchor="start">Tree-sitter symbols, imports, calls</text>
<circle class="accent" cx="88" cy="553" r="4"/>
<text class="body ink" x="104" y="559" text-anchor="start">Browser / API + recovery</text>
<rect class="soft line" x="510" y="370" width="400" height="255" rx="18" stroke-width="1.5"/>
<text class="head ink" x="538" y="413" text-anchor="start">AUTOMATIC CAPTURE</text>
<circle class="accent" cx="538" cy="451" r="4"/>
<text class="body ink" x="554" y="457" text-anchor="start">Embedded SurrealDB / RocksDB</text>
<circle class="accent" cx="538" cy="485" r="4"/>
<text class="body ink" x="554" y="491" text-anchor="start">One broker, multiple MCP sessions</text>
<circle class="accent" cx="538" cy="519" r="4"/>
<text class="body ink" x="554" y="525" text-anchor="start">Project-scoped source records</text>
<circle class="accent" cx="538" cy="553" r="4"/>
<text class="body ink" x="554" y="559" text-anchor="start">Documents, chunks, code index</text>
<rect class="soft2 line" x="960" y="370" width="420" height="255" rx="18" stroke-width="1.5"/>
<text class="head ink" x="988" y="413" text-anchor="start">ONTOLOGY + LINEAGE</text>
<circle class="accent" cx="988" cy="451" r="4"/>
<text class="body ink" x="1004" y="457" text-anchor="start">Versioned entity and relation types</text>
<circle class="accent" cx="988" cy="485" r="4"/>
<text class="body ink" x="1004" y="491" text-anchor="start">Source → evidence → assertion</text>
<circle class="accent" cx="988" cy="519" r="4"/>
<text class="body ink" x="1004" y="525" text-anchor="start">Verified cross-project identity links</text>
<circle class="accent" cx="988" cy="553" r="4"/>
<text class="body ink" x="1004" y="559" text-anchor="start">Host-supplied plans and decisions</text>
<rect class="surface line" x="60" y="700" width="1320" height="235" rx="18" stroke-width="1.5"/>
<text class="head ink" x="88" y="743" text-anchor="start">LIVE + MEMORY RETRIEVAL</text>
<text class="body ink" x="88" y="786" text-anchor="start">Fresh web · exact identifiers · BM25 keywords · vector similarity · code and graph links</text>
<text class="body muted" x="88" y="827" text-anchor="start">Personalized PageRank expands related evidence in the project graph</text>
<rect class="soft" x="88" y="857" width="1264" height="48" rx="12"/>
<text class="body ink" x="720" y="888" text-anchor="middle">Reciprocal Rank Fusion → shared reranker → evidence with provenance</text>
<rect class="soft2 line" x="60" y="1010" width="1320" height="68" rx="18" stroke-width="1.5"/>
<text class="head ink" x="88" y="1052" text-anchor="start">REUSE</text>
<text class="body ink" x="210" y="1052" text-anchor="start">Agent context · interactive PKM / Lineage / Ontology views · HTML / Neo4j export</text>
<path class="arrow" d="M260 315 V370" marker-end="url(#arrow)"/>
<path class="arrow" d="M460 495 H510" marker-end="url(#arrow)"/>
<path class="arrow" d="M910 495 H960" marker-end="url(#arrow)"/>
<path class="arrow" d="M710 625 V700" marker-end="url(#arrow)"/>
<path class="arrow" d="M1170 625 V700" marker-end="url(#arrow)"/>
<path class="dash" d="M260 625 V700"/>
<path class="arrow" d="M720 935 V1010" marker-end="url(#arrow)"/>
</svg>